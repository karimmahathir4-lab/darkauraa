publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  share_plus: ^7.2.2
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  applovin_max: ^4.6.4
  app_tracking_transparency: ^2.0.7
  purchases_flutter: ^9.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/aura_red_icon.png
