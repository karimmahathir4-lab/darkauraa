workflows:
  ios-testflight:
    name: "Dark Aura Panel"
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    integrations:
      app_store_connect: coding

    environment:
      flutter: stable
      xcode: "27.1"
      cocoapods: default
      vars:
        BUNDLE_ID: com.handcraft.darkaura
      ios_signing:
        provisioning_profiles:
          - DarkProf
        certificates:
          - CraftCer

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build signed Flutter IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.5 \
            --build-number=8 \
            --export-options-plist="$HOME/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - karimmahathir4@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
