workflows:
  ios-unsigned-test:
    name: "Dark Aura Panel - unsigned test build"
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      flutter: stable
      xcode: "27.1"
      cocoapods: default
      vars:
        BUNDLE_ID: com.handcraft.darkaura

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build unsigned app and package test IPA
        script: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.3 \
            --build-number=6

          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/ipa/Payload \
            build/ios/ipa/DarkAuraPanel-unsigned.ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
